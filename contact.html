<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chique Boutique - Contact Us</title>
    <!-- Placeholder for CSS stylesheet link -->

</head>
<body>
    <header>
        <h1>Chique Boutique</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <main>
        <h2>Contact Us</h2>
        <div>
            <p>123 Fashion Ave, Style City, FL 12345</p>
            <p>Phone: (555) 123-4567</p>
            <p>Email: info@chiqueboutique.example.com</p>
        </div>
        <h2>Send us a Message</h2>
        <form>
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <div>
                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>
            </div>
            <div>
                <input type="submit" value="Send">
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 Chique Boutique</p>
    </footer>
</body>
